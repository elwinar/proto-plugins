# https://github.com/theseus-rs/postgresql-binaries
# Provides the full PostgreSQL installation (server + client tools).
# Every binary under bin/ is shimmed explicitly, with `psql` as the primary.
# The exe list is deliberately explicit rather than `exes-dir = "bin"`: the
# Windows archive also ships DLLs, .lib files and extras (stackbuilder.exe,
# test_cloexec.exe) in bin/, which auto-discovery would turn into shims.
# The `.exe` suffix is appended automatically on Windows, so paths stay bare.
name = "postgresql"
type = "cli"

[resolve]
git-url = "https://github.com/theseus-rs/postgresql-binaries"

[platform.linux]
download-file = "postgresql-{version}-{arch}-unknown-linux-{libc}.tar.gz"
checksum-file = "postgresql-{version}-{arch}-unknown-linux-{libc}.tar.gz.sha256"
archive-prefix = "postgresql-{version}-{arch}-unknown-linux-{libc}"

[platform.macos]
download-file = "postgresql-{version}-{arch}-apple-darwin.tar.gz"
checksum-file = "postgresql-{version}-{arch}-apple-darwin.tar.gz.sha256"
archive-prefix = "postgresql-{version}-{arch}-apple-darwin"

[platform.windows]
download-file = "postgresql-{version}-{arch}-pc-windows-msvc.zip"
checksum-file = "postgresql-{version}-{arch}-pc-windows-msvc.zip.sha256"
archive-prefix = "postgresql-{version}-{arch}-pc-windows-msvc"

[install]
download-url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/{version}/{download_file}"
checksum-url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/{version}/{checksum_file}"


[install.exes.psql]
primary = true
exe-path = "bin/psql"

[install.exes.clusterdb]
exe-path = "bin/clusterdb"

[install.exes.createdb]
exe-path = "bin/createdb"

[install.exes.createuser]
exe-path = "bin/createuser"

[install.exes.dropdb]
exe-path = "bin/dropdb"

[install.exes.dropuser]
exe-path = "bin/dropuser"

[install.exes.ecpg]
exe-path = "bin/ecpg"

[install.exes.initdb]
exe-path = "bin/initdb"

[install.exes.oid2name]
exe-path = "bin/oid2name"

