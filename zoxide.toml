# https://github.com/ajeetdsouza/zoxide
# Rust project: ships musl-only Linux builds, no checksums file.
name = "zoxide"
type = "cli"

[resolve]
git-url = "https://github.com/ajeetdsouza/zoxide"

[platform.linux]
download-file = "zoxide-{version}-{arch}-unknown-linux-musl.tar.gz"
exe-path = "zoxide"

[platform.macos]
download-file = "zoxide-{version}-{arch}-apple-darwin.tar.gz"
exe-path = "zoxide"

[platform.windows]
download-file = "zoxide-{version}-{arch}-pc-windows-msvc.zip"
exe-path = "zoxide.exe"

[install]
download-url = "https://github.com/ajeetdsouza/zoxide/releases/download/v{version}/{download_file}"

[install.arch]
x86 = "i686"
